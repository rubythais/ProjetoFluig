<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <link type="text/css" rel="stylesheet" href="/style-guide/css/fluig-style-guide-flat.min.css"/>
    <link type="text/css" rel="stylesheet" href="styles.css"/>
    <script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>
    <script type="text/javascript" src="/portal/resources/js/jquery/jquery-ui.min.js"></script>
    <script type="text/javascript" src="/portal/resources/js/mustache/mustache-min.js"></script>
    <script type="text/javascript" src="/style-guide/js/fluig-style-guide.min.js"></script>
    <script type="text/javascript" src="/webdesk/vcXMLRPC.js"></script>
</head>

<body>
<div class="fluig-style-guide">
<form name="form" role="form">

    <fieldset>
        <legend>
            <span class="legend-content">
                <span class="legend-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" class="icon-svg"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/></svg>
                </span>
                Dados Pessoais
            </span>
        </legend>

        <div class="form-group">
            <label for="nome">i18n.translate("nome")</label>
            <input type="text" name="nome" id="nome" class="form-control"/>
        </div>

        <div class="form-group">    
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" class="form-control"/>
        </div>

        <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="text" name="telefone" id="telefone" class="form-control"/>
        </div>

        <div class="row">
            <div class="form-group col-md-3">
                <label for="documentoIdentidade">Documento</label>
                <input type="text" name="documentoIdentidade" id="documentoIdentidade" class="form-control"/>
            </div>

            <div class="form-group col-md-3">
                <label for="outroCampo">Outro Campo</label>
                <input type="text" name="outroCampo" id="outroCampo" class="form-control"/>
            </div>

            <div class="form-group col-md-3">
                <label for="dataNascimento">Data de Nascimento</label>
                <input type="date" name="dataNascimento" id="dataNascimento" class="form-control"/>
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>
            <span class="legend-content">
                <span class="legend-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" class="icon-svg"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-8 9c0-3.87 6-6 8-6s8 2.13 8 6v1H4v-1z"/></svg>
                </span>
                Requisitante
            </span>
        </legend>

        <div class="row">
            <div class="form-group col-md-6">
                <label for="requisitanteNome">Nome completo</label>
                <input type="text" name="requisitanteNome" id="requisitanteNome" class="form-control"/>
            </div>

            <div class="form-group col-md-3">
                <label for="requisitanteDocumento">Documento de identidade</label>
                <input type="text" name="requisitanteDocumento" id="requisitanteDocumento" class="form-control"/>
            </div>

            <div class="form-group col-md-3">
                <label for="requisitanteNascimento">Data de nascimento</label>
                <input type="date" name="requisitanteNascimento" id="requisitanteNascimento" class="form-control"/>
            </div>
        </div>

        <div class="row">
            <div class="form-group col-md-4">
                <label for="requisitanteEmail">E-mail</label>
                <input type="email" name="requisitanteEmail" id="requisitanteEmail" class="form-control"/>
            </div>

            <div class="form-group col-md-4">
                <label for="requisitanteTelefone">Telefone</label>
                <input type="text" name="requisitanteTelefone" id="requisitanteTelefone" class="form-control"/>
            </div>

            <div class="form-group col-md-4">
                <label for="requisitanteCargo">Cargo/Função</label>
                <input type="text" name="requisitanteCargo" id="requisitanteCargo" class="form-control"/>
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>
            <span class="legend-content">
                <span class="legend-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" class="icon-svg"><path d="M4 10v10h16V10l-8-6-8 6zm4 8v-4h3v4H8zm5 0v-6h3v6h-3z"/></svg>
                </span>
                Informações do Ponto
            </span>
        </legend>

        <div class="row">
            <div class="form-group col-md-4">
                <label>Tipo do Ponto</label>
                <div class="radio">
                    <label>
                        <input type="radio" name="tipoPonto" value="quiosque"> 
                        <span class="label-text">Quiosque</span>
                    </label>
                </div>
                <div class="radio">
                    <label>
                        <input type="radio" name="tipoPonto" value="loja"> 
                        <span class="label-text">Loja</span>
                    </label>
                </div>
            </div>

            <div class="form-group col-md-8">
                <label>Dias de Funcionamento</label>
                <div class="days-grid">
                    <label class="checkbox-inline"><input type="checkbox" name="domingo"> Dom</label>
                    <label class="checkbox-inline"><input type="checkbox" name="segunda"> Seg</label>
                    <label class="checkbox-inline"><input type="checkbox" name="terca"> Ter</label>
                    <label class="checkbox-inline"><input type="checkbox" name="quarta"> Qua</label>
                    <label class="checkbox-inline"><input type="checkbox" name="quinta"> Qui</label>
                    <label class="checkbox-inline"><input type="checkbox" name="sexta"> Sex</label>
                    <label class="checkbox-inline"><input type="checkbox" name="sabado"> Sab</label>
                </div>
            </div>
        </div>

        <table class="table table-striped table-hover table-condensed" id="infoTable">
            <thead>
                <tr class="active">
                    <th><strong>Campo</strong></th>
                    <th><strong>Descrição</strong></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Tipo do Ponto</td>
                    <td><span id="tipoPontoExibicao" class="text-muted">-</span></td>
                </tr>
                <tr>
                    <td>Funcionamento</td>
                    <td><span id="diasExibicao" class="text-muted">-</span></td>
                </tr>
            </tbody>
        </table>
    </fieldset>

    <fieldset>
        <legend>
            <span class="legend-content">
                <span class="legend-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" class="icon-svg"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/></svg>
                </span>
                Endereço
            </span>
        </legend>

        <div class="row">
            <div class="form-group col-md-2">
                <label for="cep">CEP</label>
                <input type="text" name="cep" id="cep" class="form-control" mask="0000-000"/>
            </div>

            <div class="form-group col-md-4">
                <label  for="logradouro">Logradouro</label>
                <input type="text" name="logradouro" id="logradouro" class="form-control"/>
            </div>

            <div class="form-group col-md-2">
                <label for="numero">Número</label>
                <input type="text" name="numero" id="numero" class="form-control"/>
            </div>
           <div class="form-group col-md-2">
                <label for="bairro">Bairro</label>
                <input type="text" name="bairro" id="bairro" class="form-control"/>
            </div>
            <div class="form-group col-md-2">
                <label for="cidade">Cidade</label>
                <input type="text" name="cidade" id="cidade" class="form-control"/>
            </div>
            <div class="form-group col-md-2">
                <label for="estado">Estado</label>
                <input type="text" name="estado" id="estado" class="form-control"/>
            </div>
        </div>
    </fieldset>

    <div class="panel panel-default">
        <div class="panel-heading">
            <h4 class="panel-title">
                <span class="fluigicon fluigicon-money"></span>
                <span>i18n.translate("financeiro")</span>
            </h4>
        </div>
        <div class="panel-body">
            <div class="row">
                <div class="form-group col-md-6">
                    <label for="moedaFinanceira">Moeda</label>
                    <select name="moedaFinanceira" id="moedaFinanceira" class="form-control" datasource="dsMoedas" datakey="simbolo" datatvalue="nomeMoeda">
                        <option value="">Selecione</option>
                    </select>
                </div>

                <div class="form-group col-md-6">
                    <label for="valor">Valor</label>
                    <input type="text" name="valor" id="valor" class="form-control"/>
                </div>
            </div>
        </div>
    </div>
</form>
</div>
</body>
</html>
<script type="text/javascript" src="css.js"></script>
<script type="text/javascript" src="form-interactions.js"></script>
<script type="text/javascript">
    var calendarioDataNascimento;
</script>
